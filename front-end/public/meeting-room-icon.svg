<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#6366f1" opacity="0.1" stroke="#6366f1" stroke-width="2"/>
  
  <!-- Door/Room frame -->
  <rect x="25" y="20" width="50" height="60" rx="4" fill="none" stroke="#6366f1" stroke-width="3"/>
  
  <!-- Door handle -->
  <circle cx="70" cy="50" r="3" fill="#6366f1"/>
  
  <!-- Room divider (window-like) -->
  <line x1="50" y1="20" x2="50" y2="80" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
  
  <!-- Meeting table inside -->
  <ellipse cx="42" cy="50" rx="10" ry="8" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.8"/>
  
  <!-- People indicators (simplified chairs) -->
  <circle cx="35" cy="48" r="2" fill="#6366f1"/>
  <circle cx="48" cy="45" r="2" fill="#6366f1"/>
  <circle cx="48" cy="55" r="2" fill="#6366f1"/>
  <circle cx="60" cy="50" r="2" fill="#6366f1"/>
  
  <!-- Top label accent -->
  <text x="50" y="15" font-size="6" font-weight="bold" text-anchor="middle" fill="#6366f1" opacity="0.7">BOOKING</text>
</svg>
